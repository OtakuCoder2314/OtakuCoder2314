# .github/workflows/update-stats.yml — ARGONAUT OS v0.9.1 (Node.js fix)
name: Refresh GitHub Stats SVG

on:
  schedule:
    - cron: "0 0 * * 0"   # Every Sunday at midnight UTC
  workflow_dispatch:        # Allow manual trigger from GitHub UI

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          node-version: '24'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          node-version: '24'

      - name: Install Pillow
        run: pip install Pillow -q

      - name: Render updated SVG
        run: python render_stats.py

      - name: Commit & push if changed
        run: |
          git config user.name  "OtakuCoder2314"
          git config user.email "146255605+OtakuCoder2314@users.noreply.github.com"
          git add github_OtakuCoder2314.svg
          git diff --cached --quiet || git commit -m "chore: auto-refresh github stats [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
